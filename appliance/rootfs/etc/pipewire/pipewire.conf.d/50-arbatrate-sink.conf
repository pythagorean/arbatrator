# The appliance has no sound hardware. Everything the browser plays goes to
# this sink; arbatrate-audio-out records its monitor and streams it to the
# client as Opus.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "arbatrate"
            node.description = "Arbatrate forward"
            media.class      = "Audio/Sink"
            object.linger    = true
            audio.position   = [ FL FR ]
            audio.rate       = 48000
            priority.session = 2000
            priority.driver  = 2000
            monitor.channel-volumes = true
        }
    }
]
